<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ed"><title>마음이 방긋 · 한글날 함께 놀아요</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap');
:root{--ink:#283f39;--green:#33755d;--cream:#fbf7ed;--muted:#65746b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:4px solid #df8b44;outline-offset:5px}header{max-width:1240px;margin:auto;padding:26px 36px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900;font-size:22px;display:flex;align-items:center;gap:12px}.brand-icon{background:#f8ce65;border-radius:14px;padding:5px 12px;transform:rotate(-7deg)}.meta{font-size:13px;color:var(--muted)}main{max-width:1160px;margin:15px auto;padding:0 32px}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:var(--green);font-size:13px;font-weight:800;letter-spacing:2px}.step-label{font-size:13px;font-weight:700}.progress{display:flex;gap:8px;margin:15px 0 34px}.progress span{height:6px;background:#e3e6d9;flex:1;border-radius:10px}.progress .active{background:#75a48b}.heading{text-align:center;position:relative}.activity-tag{display:inline-block;background:#e6edde;color:#47634f;padding:7px 15px;border-radius:30px;font-size:13px;font-weight:700}h1{font-size:clamp(32px,4.3vw,54px);letter-spacing:-2px;margin:13px 0 4px;line-height:1.3}.ru-title{font-size:clamp(21px,2.5vw,29px);font-weight:600;margin:0;color:#516c61}.instruction{font-size:17px;margin:20px 0 4px}.ru-instruction{font-size:15px;color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:30px 0 18px}.card{border:2px solid transparent;border-radius:27px;min-height:278px;padding:24px 12px 21px;position:relative;transition:transform .18s,box-shadow .18s;background:#f9e6b9;color:var(--ink)}.card:nth-child(2){background:#e6ebdc}.card:nth-child(3){background:#f6ded1}.card:hover{transform:translateY(-5px);box-shadow:0 10px 20px #3b543913}.card.selected{border-color:#39765b;box-shadow:0 0 0 4px #39765b17}.check{position:absolute;top:13px;right:16px;background:#33755d;color:white;border-radius:50%;width:27px;height:27px;display:grid;place-items:center}.art{display:block;font-size:94px;line-height:1.35;filter:drop-shadow(0 8px 0 #00000007);margin-bottom:14px}.ko{display:block;font-size:27px;font-weight:900}.ru{display:block;font-size:19px;margin-top:5px;color:#536353}.feedback{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;padding:8px 15px}.feedback small{font-weight:400;font-size:16px;color:var(--muted);margin-top:4px}.hint{font-size:14px;font-weight:400;color:var(--muted)}.nav{border-top:1px solid #dfe2d6;display:flex;align-items:center;justify-content:space-between;padding:23px 0 18px;gap:12px}.nav button{border:1px solid #d6dccc;background:transparent;color:#496052;border-radius:14px;padding:13px 23px;font-weight:700;min-height:53px}.nav button.primary{background:var(--green);color:white;border-color:var(--green);min-width:180px}.nav button:disabled{opacity:.35;cursor:default}.nav button small{font-size:12px;font-weight:400;margin-left:7px}.restart{border:0!important;font-size:13px}.nav-left{display:flex;align-items:center;gap:10px}details{background:#eeefe4;border-radius:16px;margin:8px 0 20px;padding:16px 21px;color:#52634f;font-size:14px}summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}summary:after{content:'＋'}details[open] summary:after{content:'−'}.guide{line-height:1.9;max-width:900px;padding-top:12px}.guide p{margin:7px 0}footer{text-align:center;color:#7b8575;font-size:12px;padding:6px 20px 25px}.final{background:#e8edde;border-radius:28px;text-align:center;margin:28px 0 18px;padding:27px 20px}.final .art{font-size:100px}.final h2{font-size:36px;margin:8px 0}.final p{font-size:24px;margin:8px 0}.final .hint{font-size:16px}.spark{position:fixed;pointer-events:none;font-size:30px;animation:float 1.3s ease-out forwards;z-index:10}@keyframes float{to{transform:translateY(-170px) rotate(30deg);opacity:0}}@media(min-width:1500px){main{max-width:1320px}.card{min-height:330px}.art{font-size:116px}}@media(max-width:650px){header{padding:20px}.meta{display:none}main{padding:0 18px;margin-top:10px}.brand{font-size:19px}.progress{margin-bottom:25px}.cards{gap:9px;margin-top:24px}.card{border-radius:20px;min-height:205px;padding:20px 5px 16px}.art{font-size:61px;margin-bottom:12px}.ko{font-size:20px}.ru{font-size:14px}.instruction{font-size:15px}.ru-instruction{font-size:14px}.nav button{padding:12px 14px}.nav button.primary{min-width:125px}.nav button small{display:block;margin:0}.restart{padding:8px!important;font-size:12px}.nav-left{gap:0}.feedback{font-size:17px;min-height:85px}.final h2{font-size:28px}.final p{font-size:21px}h1{letter-spacing:-1px}}
</style></head><body><header><div class="brand"><span class="brand-icon">ㄱ</span> 마음이 방긋 <span style="font-weight:400;color:#9aab92">✳</span></div><span class="meta">한글날 · 함께 놀고, 함께 만들어요 &nbsp; | &nbsp; 7–10분</span></header><main><div class="topline"><span class="eyebrow">HELLO, FRIENDS! · ПРИВЕТ, ДРУЗЬЯ!</span><span class="step-label" id="step"></span></div><div class="progress" id="progress" aria-label="활동 진행"></div><section id="activity" aria-labelledby="title"></section><nav class="nav" aria-label="활동 이동"><div class="nav-left"><button id="prev">← 이전 <small lang="ru">Назад</small></button><button class="restart" id="reset">처음부터 ↺ <small lang="ru">Сначала</small></button></div><button class="primary" id="next">다음 → <small lang="ru">Дальше</small></button></nav><details id="teacher"><summary>✎ 교사용 진행 안내 <span style="font-weight:400">7–10분 · 필요할 때 펼쳐요</span></summary><div class="guide" id="guide"></div></details></main><footer>말해도, 가리켜도, 몸으로 표현해도 좋아요. &nbsp; Можно говорить, показывать и двигаться. ♡</footer><script>
const activities=[
{tag:'01 · 마음을 나눠요',title:'오늘 내 기분은?',ru:'Какое у тебя настроение?',instruction:'나와 닮은 얼굴을 골라요. 표정으로 보여 줘도 좋아요!',sub:'Выбери похожее на тебя лицо. Можно показать мимикой!',options:[['😊','기뻐요','Мне весело'],['😴','졸려요','Хочется спать'],['🤩','설레요','Жду с радостью']],responses:[['웃는 얼굴, 반가워요!','Как приятно видеть твою улыбку!'],['졸려도 괜찮아요. 천천히 함께해요!','Можно и сонным! Давай потихоньку.'],['두근두근! 함께해서 더 신나요!','Как здорово! Вместе ещё веселее!']],guide:'<b>약 1–2분.</b> 먼저 선생님이 얼굴 표정을 크게 보여 주세요. “선생님은 여러분을 만나서 설레요!” 아이들은 그림을 가리키거나 손을 들거나 표정을 따라 합니다. 여러 기분을 골라도 괜찮습니다. 한 명씩 답을 요구하지 않고 모두의 표정을 반겨 주세요.'},
{tag:'02 · 몸으로 맞혀요',title:'어떤 동물일까요?',ru:'Что это за животное?',instruction:'선생님을 잘 보고, 닮은 동물을 찾아요!',sub:'Посмотри на учителя и выбери похожее животное!',options:[['🐱','고양이','Кошка'],['🐶','강아지','Собака'],['🐰','토끼','Кролик']],guide:'<b>약 1–2분.</b> 기본 시범은 고양이: 양손으로 수염을 만들고, 살금살금 걷고, “야옹!” 합니다. 아이들이 여러 답을 내면 “그렇게 보일 수도 있겠네요!” 하고 다시 시범을 보여 주세요. 시간이 있으면 강아지(손을 앞발처럼 들고 꼬리 흔들기), 토끼(머리 위 두 귀로 깡충깡충)도 해 봅니다. 클릭한 동물이 선생님의 시범과 일치하는지는 선생님이 따뜻하게 이야기해 주세요.'},
{tag:'03 · 반가움을 전해요',title:'함께 인사해요!',ru:'Давайте поздороваемся!',instruction:'원하는 인사를 골라요. 다 같이 따라 해요!',sub:'Выбери приветствие. Повторим все вместе!',options:[['👋','손 흔들기','Помашем'],['👏','박수','Похлопаем'],['🫶','하트','Сердечко']],guide:'<b>약 1분.</b> 선생님이 세 동작을 먼저 보여 주세요. 선택한 인사를 모두 함께 2–3번 합니다. 서로 다른 인사를 해도 모두 인정합니다. “안녕! Привет!” 하고 선생님이 먼저 인사하세요. 움직이기 불편한 아이는 눈인사나 미소로 참여해도 좋습니다.'},
{tag:'04 · 오늘은 여러분이 선생님',title:'선생님에게 알려줘요!',ru:'Научите учителя!',instruction:'이 동물은 러시아어로 뭐라고 해요?',sub:'Как называется это животное по-русски?',options:[['🐱','고양이','Кошка'],['🐶','강아지','Собака'],['🐰','토끼','Кролик']],guide:'<b>약 2분.</b> 그림 하나를 가리키고 아이들이 먼저 러시아어 이름을 말하게 합니다. 선생님이 배우는 역할입니다. <b>Кошка(코시카) = 고양이, Собака(사바카) = 개·강아지, Кролик(크롤릭) = 토끼.</b> Кот(코트, 수고양이), Котик(코틱, 고양이 애칭), Заяц(자야츠, 산토끼)도 자연스럽게 받아 주세요. 한글 발음은 참고용이며 아이들의 발음을 듣고 따라 합니다. “제가 잘했나요?” 하고 웃으며 한 번 더 배워 보세요. 한국어 이름도 함께 말해 봅니다.'},
{tag:'05 · 만들기를 시작해요',title:'오늘 무엇을 만들까요?',ru:'Что мы сегодня сделаем?',instruction:'우리가 만들 것을 찾아요!',sub:'Выбери, что мы будем делать!',options:[['📖','책','Книга'],['🧢','모자','Кепка'],['👟','신발','Обувь']],guide:'<b>약 1분.</b> 책을 고르면 마무리 화면이 나타납니다. 모자나 신발을 골라도 “재미있는 생각이에요!” 하고 반겨 주세요. 두 손을 책처럼 펼쳐 힌트를 주고 다시 고릅니다. 마지막에 실제 종이와 책 견본을 보여 주며 북 만들기로 연결하세요.'}
];let index=0,choices=[null,null,null,null,null],finished=false;
const el=id=>document.getElementById(id);
function render(){const a=activities[index];el('step').textContent=finished?'함께할 준비 완료!':`${index+1} / 5`;el('progress').innerHTML=activities.map((_,i)=>`<span class="${i<=index?'active':''}" aria-label="${i+1}번 활동"></span>`).join('');el('guide').innerHTML=`<p>${a.guide}</p><p><b>함께하는 약속:</b> 점수와 탈락은 없습니다. 러시아어 대답, 그림 가리키기, 손짓과 몸짓 모두 참여입니다. 약 20명이 자리에서 함께 표현하도록 진행하고, 대답을 강요하지 마세요.</p>`;
if(finished){el('activity').innerHTML='<div class="heading"><span class="activity-tag">함께라서 즐거워요 · Как здорово быть вместе!</span></div><div class="final"><span class="art" role="img" aria-label="책과 반짝임">📖 ✨</span><h2 id="title">우리만의 책을 만들어요!</h2><p lang="ru">Давайте сделаем свою книгу!</p><div class="hint">우리의 이야기, 우리의 그림을 담아요.<br><span lang="ru">Наполним её нашими историями и рисунками.</span></div></div><div class="feedback">함께해 줘서 고마워요! ♡<small lang="ru">Спасибо, что мы вместе!</small></div>';}else{el('activity').innerHTML=`<div class="heading"><span class="activity-tag">${a.tag}</span><h1 id="title">${a.title}</h1><p class="ru-title" lang="ru">${a.ru}</p><p class="instruction">${a.instruction}</p><p class="ru-instruction" lang="ru">${a.sub}</p></div><div class="cards">${a.options.map((o,i)=>`<button class="card ${choices[index]===i?'selected':''}" aria-pressed="${choices[index]===i}" data-choice="${i}">${choices[index]===i?'<span class="check" aria-hidden="true">✓</span>':''}<span class="art" role="img" aria-label="${o[1]}">${o[0]}</span><span class="ko">${o[1]}</span><span class="ru" lang="ru">${o[2]}</span></button>`).join('')}</div><div class="feedback" aria-live="polite" id="feedback">${feedback()}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));}el('prev').disabled=index===0&&!finished;el('next').disabled=finished;el('next').innerHTML=index===4?'책 만들러 가요 → <small lang="ru">К нашей книге</small>':'다음 → <small lang="ru">Дальше</small>';}
function feedback(){let c=choices[index];if(c===null)return '<span class="hint">어떤 대답도 반가워요! · Мы рады любому ответу!</span>';let r=index===0?activities[0].responses[c]:index===1?['생각을 들려줘서 고마워요! 같이 흉내 내 볼까요?','Спасибо за ответ! Давайте покажем вместе!']:index===2?['멋진 인사예요! 모두 함께 해요!','Отличное приветствие! Повторим все вместе!']:index===3?[`고마워요! “${activities[3].options[c][2]}!” 선생님도 따라 해요.`,`Спасибо! Учитель тоже повторяет: «${activities[3].options[c][2]}»!`]:['재미있는 생각이에요! 두 손을 책처럼 펼쳐 볼까요?','Интересная идея! Раскроем ладошки, как книгу.'];return `${r[0]}<small lang="ru">${r[1]}</small>`;}
function choose(c){choices[index]=c;if(index===4&&c===0)finished=true;render();celebrate();}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<7;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✦','♡','✳'][i%3];s.style.cssText=`left:${20+Math.random()*60}%;top:70%;color:${['#d8a540','#d98873','#6e9b7c'][i%3]};animation-delay:${i*.04}s`;document.body.append(s);setTimeout(()=>s.remove(),1700);}}
el('next').onclick=()=>{if(index<4){index++;render();}else if(!finished){el('feedback').innerHTML='책 그림을 골라 볼까요? 📖<small lang="ru">Давайте выберем книгу!</small>';}};el('prev').onclick=()=>{if(finished){finished=false;choices[4]=null;}else index=Math.max(0,index-1);render();};el('reset').onclick=()=>{index=0;choices.fill(null);finished=false;el('teacher').open=false;render();};render();
</script></body></html>
